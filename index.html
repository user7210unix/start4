<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>startpage</title>
<style>
  /* ── design tokens ─────────────────────────────────────────────── */
  :root {
    --c-bg:          #000000;
    --c-bg1:         #0d0d0d;
    --c-bg2:         #1a1a1a;
    --c-border:      #2a2a2a;
    --c-border-hi:   #3a3a3a;
    --c-fg:          #d4d4d4;
    --c-fg-dim:      #666666;
    --c-fg-faint:    #333333;
    --c-teal:        #1a5f5f;
    --c-teal-hi:     #1f7070;
    --c-teal-text:   #2a9090;
    --c-danger:      #7a2222;
    --c-danger-hi:   #aa2222;

    --font-mono:     "Terminus", "Terminus (TTF)", "DejaVu Sans Mono", monospace;

    --sz-font:       12px;
    --sz-font-link:  13px;
    --sz-font-label: 10px;

    --sp-xs:         4px;
    --sp-sm:         8px;
    --sp-md:         16px;
    --sp-lg:         32px;
    --sp-xl:         64px;

    --link-min-w:    140px;
    --link-pad-v:    var(--sp-sm);
    --link-pad-h:    var(--sp-md);
    --link-gap:      var(--sp-md);

    --panel-w:       260px;
    --panel-pad:     var(--sp-md);

    --anim-fast:     80ms;
    --anim-mid:      160ms;
    --anim-slow:     260ms;

    /* touch target minimum — WCAG 2.5.5 */
    --touch-min:     44px;
  }

  /* ── reset ─────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--c-bg);
    color: var(--c-fg);
    font-family: var(--font-mono);
    font-size: var(--sz-font);
    line-height: 1.4;
    overflow: hidden;          /* desktop: no scroll */
    -webkit-text-size-adjust: 100%; /* prevent iOS font inflation */
  }

  /* ── root layout ────────────────────────────────────────────────── */
  #app {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ── link grid ──────────────────────────────────────────────────── */
  #grid {
    display: grid;
    /* columns driven by JS via --cols custom property */
    grid-template-columns: repeat(var(--cols, 2), auto);
    gap: var(--link-gap);
    /* don't overflow the viewport */
    max-width: calc(100vw - var(--sp-lg) * 2);
  }

  /* ── single link ────────────────────────────────────────────────── */
  .link-item {
    display: block;
    min-width: var(--link-min-w);
    padding: var(--link-pad-v) var(--link-pad-h);
    background: transparent;
    border: 1px solid var(--c-border);
    color: var(--c-fg-dim);
    font-family: var(--font-mono);
    font-size: var(--sz-font-link);
    text-decoration: none;
    text-align: center;
    letter-spacing: 0.04em;
    cursor: pointer;
    /* tap highlight: none on mobile */
    -webkit-tap-highlight-color: transparent;
    transition:
      color       var(--anim-fast) linear,
      border-color var(--anim-fast) linear,
      background  var(--anim-fast) linear;
    /* no border-radius — sharp */
  }

  /* active state covers :hover for touch (no hover on mobile) */
  .link-item:hover,
  .link-item:active {
    color: var(--c-fg);
    border-color: var(--c-teal);
    background: var(--c-bg1);
  }

  /* ── "options" trigger — bottom-left corner ─────────────────────── */
  #options-trigger {
    position: fixed;
    bottom: var(--sp-lg);
    left:   var(--sp-lg);
    font-family: var(--font-mono);
    font-size: var(--sz-font-label);
    color: transparent;           /* invisible until hover */
    letter-spacing: 0.08em;
    text-transform: lowercase;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    /* generous touch target without visual bloat */
    padding: var(--sp-sm);
    margin: calc(var(--sp-sm) * -1); /* offset padding so position stays the same */
    transition: color var(--anim-mid) linear;
    z-index: 10;
  }

  /* show when page is hovered (desktop) */
  #app:hover #options-trigger,
  #options-trigger:hover {
    color: var(--c-fg-faint);
  }

  #options-trigger:hover,
  #options-trigger:active {
    color: var(--c-teal-text);
  }

  /* touch: always show dimly so it's discoverable without hover */
  @media (hover: none) {
    #options-trigger {
      color: var(--c-fg-faint);
    }
  }

  /* ── options panel ──────────────────────────────────────────────── */
  #options-panel {
    position: fixed;
    bottom: calc(var(--sp-lg) + var(--sz-font-label) + var(--sp-sm));
    left: var(--sp-lg);
    width: var(--panel-w);
    background: var(--c-bg1);
    border: 1px solid var(--c-border);
    padding: var(--panel-pad);
    display: flex;
    flex-direction: column;
    gap: var(--sp-md);
    z-index: 20;
    /* hidden by default */
    opacity: 0;
    pointer-events: none;
    transform: translateY(var(--sp-sm));
    transition:
      opacity   var(--anim-slow) linear,
      transform var(--anim-slow) linear;
  }

  #options-panel.visible {
    opacity: 1;
    pointer-events: all;
    transform: translateY(0);
  }

  /* section label */
  .panel-label {
    font-size: var(--sz-font-label);
    color: var(--c-teal-text);
    letter-spacing: 0.10em;
    text-transform: lowercase;
    border-bottom: 1px solid var(--c-border);
    padding-bottom: var(--sp-xs);
    margin-bottom: calc(var(--sp-xs) / 2);
  }

  /* ── column control ─────────────────────────────────────────────── */
  #col-control {
    display: flex;
    align-items: center;
    gap: var(--sp-sm);
  }

  .col-btn {
    background: transparent;
    border: 1px solid var(--c-border);
    color: var(--c-fg-dim);
    font-family: var(--font-mono);
    font-size: var(--sz-font));
    padding: var(--sp-xs) var(--sp-sm);
    cursor: pointer;
    transition:
      color        var(--anim-fast) linear,
      border-color var(--anim-fast) linear,
      background   var(--anim-fast) linear;
  }

  .col-btn:hover,
  .col-btn:active {
    color: var(--c-fg);
    border-color: var(--c-teal);
    background: var(--c-bg2);
  }

  #col-display {
    flex: 1;
    text-align: center;
    color: var(--c-fg-dim);
    font-size: var(--sz-font-label);
    letter-spacing: 0.06em;
  }

  /* ── add link form ──────────────────────────────────────────────── */
  #add-form {
    display: flex;
    flex-direction: column;
    gap: var(--sp-xs);
  }

  .panel-input {
    background: var(--c-bg);
    border: 1px solid var(--c-border);
    color: var(--c-fg);
    font-family: var(--font-mono);
    font-size: var(--sz-font));
    padding: var(--sp-xs) var(--sp-sm);
    outline: none;
    width: 100%;
    transition: border-color var(--anim-fast) linear;
  }

  .panel-input:focus {
    border-color: var(--c-teal-hi);
  }

  .panel-input::placeholder {
    color: var(--c-fg-faint);
  }

  .btn-add {
    background: transparent;
    border: 1px solid var(--c-teal);
    color: var(--c-teal-text);
    font-family: var(--font-mono);
    font-size: var(--sz-font-label);
    letter-spacing: 0.08em;
    padding: var(--sp-xs) var(--sp-sm);
    cursor: pointer;
    text-align: center;
    transition:
      background   var(--anim-fast) linear,
      color        var(--anim-fast) linear;
  }

  .btn-add:hover,
  .btn-add:active {
    background: var(--c-teal);
    color: var(--c-fg);
  }

  /* ── link list (remove section) ─────────────────────────────────── */
  #link-list {
    display: flex;
    flex-direction: column;
    gap: var(--sp-xs);
    max-height: 180px;
    overflow-y: auto;
  }

  #link-list::-webkit-scrollbar { width: 2px; }
  #link-list::-webkit-scrollbar-track { background: transparent; }
  #link-list::-webkit-scrollbar-thumb { background: var(--c-border-hi); }

  .link-row {
    display: flex;
    align-items: center;
    gap: var(--sp-xs);
    color: var(--c-fg-dim);
    font-size: var(--sz-font));
  }

  .link-row-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: var(--sz-font));
  }

  .btn-remove {
    background: transparent;
    border: 1px solid transparent;
    color: var(--c-fg-faint);
    font-family: var(--font-mono);
    font-size: var(--sz-font-label);
    padding: 1px var(--sp-xs);
    cursor: pointer;
    flex-shrink: 0;
    transition:
      color        var(--anim-fast) linear,
      border-color var(--anim-fast) linear;
  }

  .btn-remove:hover,
  .btn-remove:active {
    color: var(--c-danger-hi);
    border-color: var(--c-danger);
  }

  /* ── close button ───────────────────────────────────────────────── */
  #btn-close-panel {
    background: transparent;
    border: none;
    color: var(--c-fg-faint);
    font-family: var(--font-mono);
    font-size: var(--sz-font-label);
    letter-spacing: 0.08em;
    cursor: pointer;
    text-align: right;
    padding: 0;
    align-self: flex-end;
    transition: color var(--anim-fast) linear;
  }

  #btn-close-panel:hover { color: var(--c-fg-dim); }

  /* ── empty state ────────────────────────────────────────────────── */
  #empty-hint {
    color: var(--c-fg-faint);
    font-size: var(--sz-font-label);
    text-align: center;
    letter-spacing: 0.06em;
    display: none;
  }

  /* ── mobile breakpoint ──────────────────────────────────────────── */
  /*
   * On narrow viewports:
   *  - panel goes full-width, anchored to bottom edge
   *  - link grid switches to 1 column (user col setting still applies via --cols)
   *  - fonts scale up slightly for finger-friendliness
   *  - link min-width set to fill available space
   *  - inputs/buttons get min touch target height
   */
  @media (max-width: 540px) {
    :root {
      --sz-font:       14px;
      --sz-font-link:  14px;
      --sz-font-label: 12px;
      --sp-xs:         6px;
      --sp-sm:         10px;
      --sp-md:         18px;
      --sp-lg:         20px;
      --link-min-w:    0px;      /* links stretch to fill grid cell */
      --panel-w:       100vw;    /* full width on mobile */
      --panel-pad:     var(--sp-md);
    }

    html, body {
      overflow: auto;            /* allow scrolling if panel is tall */
      height: auto;
      min-height: 100%;
    }

    #app {
      min-height: 100svh;        /* svh = small viewport height (accounts for mobile chrome) */
      height: auto;
      padding: var(--sp-xl) var(--sp-lg);
    }

    #grid {
      grid-template-columns: repeat(var(--cols, 1), 1fr);
      width: min(100%, calc(var(--touch-min) * 5));
      max-width: 100%;
    }

    .link-item {
      width: 100%;
      min-height: var(--touch-min);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* panel: full-width sheet from bottom, scrollable internally */
    #options-panel {
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-height: 80svh;
      overflow-y: auto;
      border-left: none;
      border-right: none;
      border-bottom: none;
      border-top: 1px solid var(--c-border);
      /* reset upward slide to downward */
      transform: translateY(100%);
    }

    #options-panel.visible {
      transform: translateY(0);
    }

    /* col buttons: taller touch targets */
    .col-btn {
      min-height: var(--touch-min);
      min-width: var(--touch-min);
    }

    /* inputs: prevent iOS zoom (font-size must be >= 16px on inputs) */
    .panel-input {
      font-size: 16px;
      min-height: var(--touch-min);
    }

    .btn-add {
      min-height: var(--touch-min);
      font-size: var(--sz-font-label);
    }

    .btn-remove {
      min-height: calc(var(--touch-min) * 0.75);
      min-width: calc(var(--touch-min) * 1.5);
    }

    /* trigger: bottom-left, always visible on touch */
    #options-trigger {
      bottom: var(--sp-md);
      left:   var(--sp-md);
    }
  }

  /* very small screens (320px phones) */
  @media (max-width: 360px) {
    :root {
      --sp-lg: var(--sp-md);
    }
  }
</style>
</head>
<body>
<div id="app">

  <!-- centered link grid -->
  <div id="grid"></div>

  <!-- empty state -->
  <div id="empty-hint">no links. hover → options → add link.</div>

  <!-- options trigger (bottom-left, appears on page hover) -->
  <div id="options-trigger" role="button" tabindex="0">options</div>

  <!-- options panel -->
  <div id="options-panel" role="dialog" aria-label="Options">

    <!-- columns -->
    <div class="panel-label">columns</div>
    <div id="col-control">
      <button class="col-btn" id="btn-col-dec">−</button>
      <span id="col-display">2 col</span>
      <button class="col-btn" id="btn-col-inc">+</button>
    </div>

    <!-- add link -->
    <div class="panel-label">add link</div>
    <div id="add-form">
      <input class="panel-input" id="input-label" type="text" placeholder="label" autocomplete="off" spellcheck="false">
      <input class="panel-input" id="input-url"   type="url"  placeholder="https://" autocomplete="off" spellcheck="false">
      <button class="btn-add" id="btn-add">add</button>
    </div>

    <!-- remove links -->
    <div class="panel-label">links</div>
    <div id="link-list"></div>

    <button id="btn-close-panel">close</button>
  </div>
</div>

<script>
  /* ── state ─────────────────────────────────────────────────────── */
  const STORAGE_KEY = 'startpage_v1';

  const DEFAULT_LINKS = [
    { label: 'github',    url: 'https://github.com' },
    { label: 'proton',    url: 'https://mail.proton.me' },
    { label: 'lobsters',  url: 'https://lobste.rs' },
    { label: 'archwiki',  url: 'https://wiki.archlinux.org' },
  ];

  const MIN_COLS = 1;
  const MAX_COLS = 8;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    return { links: DEFAULT_LINKS, cols: 2 };
  }

  function saveState(state) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
  }

  let state = loadState();

  /* ── dom refs ───────────────────────────────────────────────────── */
  const grid         = document.getElementById('grid');
  const emptyHint    = document.getElementById('empty-hint');
  const trigger      = document.getElementById('options-trigger');
  const panel        = document.getElementById('options-panel');
  const colDisplay   = document.getElementById('col-display');
  const btnColDec    = document.getElementById('btn-col-dec');
  const btnColInc    = document.getElementById('btn-col-inc');
  const inputLabel   = document.getElementById('input-label');
  const inputUrl     = document.getElementById('input-url');
  const btnAdd       = document.getElementById('btn-add');
  const linkList     = document.getElementById('link-list');
  const btnClose     = document.getElementById('btn-close-panel');

  /* ── render ─────────────────────────────────────────────────────── */
  function render() {
    /* apply column count via CSS custom property — no magic numbers */
    grid.style.setProperty('--cols', state.cols);
    colDisplay.textContent = `${state.cols} col`;

    /* grid links */
    grid.innerHTML = '';
    state.links.forEach((link, i) => {
      const a = document.createElement('a');
      a.className = 'link-item';
      a.href = link.url;
      a.textContent = link.label;
      a.dataset.index = i;
      grid.appendChild(a);
    });

    /* empty hint */
    emptyHint.classList.toggle('visible', state.links.length === 0);
    grid.style.display = state.links.length === 0 ? 'none' : 'grid';

    /* link list in panel */
    linkList.innerHTML = '';
    if (state.links.length === 0) {
      const empty = document.createElement('div');
      empty.style.color = 'var(--c-fg-faint)';
      empty.style.fontSize = 'var(--sz-font-label)';
      empty.textContent = 'no links';
      linkList.appendChild(empty);
    } else {
      state.links.forEach((link, i) => {
        const row = document.createElement('div');
        row.className = 'link-row';

        const label = document.createElement('span');
        label.className = 'link-row-label';
        label.textContent = link.label;
        label.title = link.url;

        const btn = document.createElement('button');
        btn.className = 'btn-remove';
        btn.textContent = 'remove';
        btn.dataset.index = i;
        btn.addEventListener('click', () => removeLink(i));

        row.appendChild(label);
        row.appendChild(btn);
        linkList.appendChild(row);
      });
    }

    /* col buttons enabled state */
    btnColDec.disabled = state.cols <= MIN_COLS;
    btnColInc.disabled = state.cols >= MAX_COLS;
    btnColDec.style.opacity = state.cols <= MIN_COLS ? '0.3' : '1';
    btnColInc.style.opacity = state.cols >= MAX_COLS ? '0.3' : '1';

    saveState(state);
    // re-apply responsive column cap after any state change
    if (typeof applyResponsiveCols === 'function') applyResponsiveCols();
  }

  /* ── mutations ──────────────────────────────────────────────────── */
  function addLink() {
    const label = inputLabel.value.trim();
    let   url   = inputUrl.value.trim();
    if (!label || !url) return;
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    state.links.push({ label, url });
    inputLabel.value = '';
    inputUrl.value   = '';
    render();
  }

  function removeLink(index) {
    state.links.splice(index, 1);
    render();
  }

  function changeCol(delta) {
    const next = state.cols + delta;
    if (next < MIN_COLS || next > MAX_COLS) return;
    state.cols = next;
    render();
  }

  /* ── panel toggle ───────────────────────────────────────────────── */
  let panelOpen = false;

  function openPanel() {
    panelOpen = true;
    panel.classList.add('visible');
    inputLabel.focus();
  }

  function closePanel() {
    panelOpen = false;
    panel.classList.remove('visible');
  }

  /* ── event wiring ───────────────────────────────────────────────── */
  trigger.addEventListener('click', () => panelOpen ? closePanel() : openPanel());
  trigger.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); panelOpen ? closePanel() : openPanel(); } });

  btnClose.addEventListener('click', closePanel);

  btnColDec.addEventListener('click', () => changeCol(-1));
  btnColInc.addEventListener('click', () => changeCol(+1));

  btnAdd.addEventListener('click', addLink);

  inputUrl.addEventListener('keydown', e => { if (e.key === 'Enter') addLink(); });
  inputLabel.addEventListener('keydown', e => { if (e.key === 'Enter') inputUrl.focus(); });

  /* close panel on outside click */
  document.addEventListener('click', e => {
    if (panelOpen && !panel.contains(e.target) && e.target !== trigger) closePanel();
  });

  /* close on Escape */
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && panelOpen) closePanel(); });

  /* ── init ───────────────────────────────────────────────────────── */
  render();

  /* On mobile, clamp --cols to a sensible max based on viewport width
     so the grid never overflows when the user set many columns on desktop.
     We don't mutate state.cols — just override the CSS property at render time. */
  function applyResponsiveCols() {
    const vw = window.innerWidth;
    // rough px per column: link-min-w token is 140px on desktop, 0 on mobile
    // use a simple viewport-fraction heuristic instead of reading computed styles
    const maxFit = vw < 541 ? Math.max(1, Math.floor(vw / 120)) : MAX_COLS;
    const effective = Math.min(state.cols, maxFit);
    grid.style.setProperty('--cols', effective);
  }

  applyResponsiveCols();
  window.addEventListener('resize', applyResponsiveCols, { passive: true });
</script>
</body>
</html>
